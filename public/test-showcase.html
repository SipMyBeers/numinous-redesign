<html><body style="margin:0;overflow:hidden;background:black">
<div id="status" style="position:fixed;top:20px;left:20px;z-index:999;color:lime;font-size:24px;font-family:monospace;background:rgba(0,0,0,0.8);padding:10px 20px">LOADING...</div>
<canvas id="c" style="display:block;width:100vw;height:100vh"></canvas>
<script>
var c=document.getElementById('c');
var W=c.width=window.innerWidth;
var H=c.height=window.innerHeight;
var gl=c.getContext('webgl')||c.getContext('experimental-webgl');

if(!gl){document.body.innerHTML='<h1 style="color:red">NO WEBGL</h1>';}

var VS='attribute vec2 a_pos; void main(){gl_Position=vec4(a_pos,0.0,1.0);}';
var FS=[
'precision mediump float;',
'uniform float u_time;',
'uniform vec2 u_resolution;',
'uniform vec2 u_mouse;',
'',
'vec3 mod289a(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}',
'vec2 mod289b(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}',
'vec3 permute(vec3 x){return mod289a(((x*34.0)+1.0)*x);}',
'float snoise(vec2 v){',
'  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);',
'  vec2 i=floor(v+dot(v,C.yy));',
'  vec2 x0=v-i+dot(i,C.xx);',
'  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);',
'  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1;',
'  i=mod289b(i);',
'  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));',
'  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);',
'  m=m*m;m=m*m;',
'  vec3 x=2.0*fract(p*C.www)-1.0;',
'  vec3 h=abs(x)-0.5;',
'  vec3 ox=floor(x+0.5);',
'  vec3 a0=x-ox;',
'  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);',
'  vec3 g;',
'  g.x=a0.x*x0.x+h.x*x0.y;',
'  g.yz=a0.yz*x12.xz+h.yz*x12.yw;',
'  return 130.0*dot(m,g);',
'}',
'',
'void main(){',
'  vec2 uv=gl_FragCoord.xy/u_resolution;',
'  vec2 p=(gl_FragCoord.xy-u_resolution*0.5)/min(u_resolution.x,u_resolution.y);',
'  float t=u_time;',
'  vec2 mouse=u_mouse*2.0-1.0;',
'',
'  float f1=snoise(p*2.0+vec2(t*0.3,t*0.2)+mouse*0.3);',
'  float f2=snoise(p*3.0-vec2(t*0.2,t*0.15));',
'  float f3=snoise(p*5.0+vec2(f1,f2)*0.5);',
'  float fluid=(f1+f2*0.5+f3*0.25)/1.75*0.5+0.5;',
'',
'  float a=atan(p.y-mouse.y*0.08,p.x-mouse.x*0.08);',
'  float r=length(p-mouse*0.08);',
'  float shape=r-(0.28+0.08*sin(a*5.0+t*0.5));',
'  float mask=smoothstep(0.02,-0.02,shape);',
'  float edge=smoothstep(0.04,0.0,abs(shape));',
'',
'  vec3 bg=vec3(0.05,0.05,0.07);',
'  vec3 ember=vec3(0.95,0.42,0.21);',
'  vec3 cyan=vec3(0.3,0.62,0.75);',
'',
'  vec3 col=bg;',
'  col=mix(col,ember,smoothstep(0.3,0.7,fluid)*0.6);',
'  col=mix(col,cyan,smoothstep(0.5,0.9,fluid+snoise(p*4.0+t*0.1))*0.3);',
'',
'  vec3 sc=vec3(0.85+fluid*0.15);',
'  sc=mix(sc,ember,0.3);',
'  col=mix(col,sc,mask);',
'  col+=ember*edge*0.8;',
'',
'  float rd=length(p);',
'  col.r*=1.0+0.003*rd*8.0;',
'  col.b*=1.0-0.003*rd*4.0;',
'',
'  col+=sin(gl_FragCoord.y*1.5+t*2.0)*0.015;',
'  col*=max(1.0-rd*1.1,0.0);',
'',
'  gl_FragColor=vec4(max(col,0.0),1.0);',
'}'
].join('\n');

function compile(src,type){
  var s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    var err=gl.getShaderInfoLog(s);
    document.body.innerHTML='<pre style="color:yellow;background:black;padding:20px;font-size:14px">SHADER ERROR:\n'+err+'</pre>';
    return null;
  }
  return s;
}

var vs=compile(VS,gl.VERTEX_SHADER);
var fs=compile(FS,gl.FRAGMENT_SHADER);
if(!vs||!fs){throw 'shader failed';}

var prog=gl.createProgram();
gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){
  document.body.innerHTML='<pre style="color:yellow;background:black;padding:20px">LINK ERROR:\n'+gl.getProgramInfoLog(prog)+'</pre>';
  throw 'link failed';
}
gl.useProgram(prog);

var buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var aPos=gl.getAttribLocation(prog,'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
gl.viewport(0,0,W,H);

var uTime=gl.getUniformLocation(prog,'u_time');
var uRes=gl.getUniformLocation(prog,'u_resolution');
var uMouse=gl.getUniformLocation(prog,'u_mouse');

var mx=0.5,my=0.5;
document.onmousemove=function(e){mx=e.clientX/innerWidth;my=e.clientY/innerHeight;};
window.onresize=function(){W=c.width=innerWidth;H=c.height=innerHeight;gl.viewport(0,0,W,H);};

document.getElementById('status').textContent='WebGL OK - Starting render loop...';

var start=Date.now();
var frameCount=0;
function loop(){
  frameCount++;
  if(frameCount===1) document.getElementById('status').textContent='RENDERING - Frame '+frameCount;
  if(frameCount===60) document.getElementById('status').style.display='none';
  gl.uniform1f(uTime,(Date.now()-start)/1000);
  gl.uniform2f(uRes,W,H);
  gl.uniform2f(uMouse,mx,my);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(loop);
}
loop();

document.body.style.margin='0';
document.body.style.overflow='hidden';
</script>
</body></html>
